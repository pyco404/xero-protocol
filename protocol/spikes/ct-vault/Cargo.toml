[package]
name = "ct-vault"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway privacy spike: a PDA-owned confidential vault with policy checks on encrypted amounts"

# Standalone: not part of the protocol/ Anchor workspace.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
solana-program = "3"
solana-system-interface = { version = "=3.3.0", features = ["bincode"] }
solana-zk-elgamal-proof-interface = "=0.1.3"
solana-zk-sdk-pod = "=0.1.2"
spl-token-2022-interface = "=3.1.2"
spl-token-confidential-transfer-ciphertext-arithmetic = "=0.5.1"
spl-token-confidential-transfer-proof-extraction = "=0.6.1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
